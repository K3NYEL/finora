name: Finora Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/finora-release.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=${{ github.workspace }}/android/app/finora-release.jks
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Extract release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="${VERSION}+$(sed -n 's/^version: [^+]*+//p' pubspec.yaml | head -n 1)"
          if [ -z "$BUILD" ]; then
            BUILD="$(grep '^version:' pubspec.yaml | sed -E 's/.*+([0-9]+).*/\1/')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
          echo "Release build: $BUILD"

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Rename release artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_DIR="build/app/outputs/flutter-apk"

          mv "$APK_DIR/app-arm64-v8a-release.apk" "$APK_DIR/Finora_v$VERSION"_arm64-v8a.apk
          mv "$APK_DIR/app-armeabi-v7a-release.apk" "$APK_DIR/Finora_v$VERSION"_armeabi-v7a.apk
          mv "$APK_DIR/app-x86_64-release.apk" "$APK_DIR/Finora_v$VERSION"_x86_64.apk

      - name: Generate checksums
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_DIR="build/app/outputs/flutter-apk"

          cd "$APK_DIR"
          sha256sum "Finora_v$VERSION"_arm64-v8a.apk \
                    "Finora_v$VERSION"_armeabi-v7a.apk \
                    "Finora_v$VERSION"_x86_64.apk \
            > "Finora_v$VERSION"_SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Finora v${{ steps.version.outputs.version }}

            **Versión:** ${{ steps.version.outputs.version }}
            **Build:** ${{ steps.version.outputs.build }}

            Esta release fue generada automáticamente por GitHub Actions.

          files: |
            build/app/outputs/flutter-apk/Finora_v${{ steps.version.outputs.version }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/Finora_v${{ steps.version.outputs.version }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/Finora_v${{ steps.version.outputs.version }}_x86_64.apk
            build/app/outputs/flutter-apk/Finora_v${{ steps.version.outputs.version }}_SHA256SUMS.txt

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/finora-release.jks
