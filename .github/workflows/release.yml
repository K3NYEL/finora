name: Finora Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/finora-release.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=\${{ github.workspace }}/android/app/finora-release.jks
          EOF

      - name: Validate production signing configuration
        env:
          STORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -s android/app/finora-release.jks
          test -s android/key.properties
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "Production signing configuration is present."

      - name: Analyze
        run: flutter analyze

      - name: Extract release version
        id: version
        shell: bash
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          BUILD="$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*/\1/')"

          if [ -z "$VERSION" ] || [ -z "$BUILD" ]; then
            echo "ERROR: Could not extract version/build from pubspec.yaml."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
          echo "Release build: $BUILD"

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          echo "APK certificate:"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK"

      - name: Upload verification APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Finora-signing-verification
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      - name: Rename release artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="\${{ steps.version.outputs.version }}"
          APK_DIR="build/app/outputs/flutter-apk"

          mv "$APK_DIR/app-arm64-v8a-release.apk" "$APK_DIR/Finora_v$VERSION"_arm64-v8a.apk
          mv "$APK_DIR/app-armeabi-v7a-release.apk" "$APK_DIR/Finora_v$VERSION"_armeabi-v7a.apk
          mv "$APK_DIR/app-x86_64-release.apk" "$APK_DIR/Finora_v$VERSION"_x86_64.apk

      - name: Generate checksums
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="\${{ steps.version.outputs.version }}"
          APK_DIR="build/app/outputs/flutter-apk"

          cd "$APK_DIR"
          sha256sum "Finora_v$VERSION"_arm64-v8a.apk \
                    "Finora_v$VERSION"_armeabi-v7a.apk \
                    "Finora_v$VERSION"_x86_64.apk \
            > "Finora_v$VERSION"_SHA256SUMS.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Finora v\${{ steps.version.outputs.version }}

            **Versión:** \${{ steps.version.outputs.version }}
            **Build:** \${{ steps.version.outputs.build }}

            Esta release fue generada automáticamente por GitHub Actions.

          files: |
            build/app/outputs/flutter-apk/Finora_v\${{ steps.version.outputs.version }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/Finora_v\${{ steps.version.outputs.version }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/Finora_v\${{ steps.version.outputs.version }}_x86_64.apk
            build/app/outputs/flutter-apk/Finora_v\${{ steps.version.outputs.version }}_SHA256SUMS.txt

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/finora-release.jks
